
<!-- 插件部署对话框（通用，由 plugin.json 驱动） -->
  <div id="plugin-deploy-modal" class="modal-overlay">
    <div class="modal-container plugin-deploy-container">
      <div class="modal-header">
        <div class="modal-title">
          <span class="modal-icon" style="color: var(--accent);">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
          </span>
          <span id="plugin-deploy-title">安装插件</span>
        </div>
        <button type="button" class="modal-close-icon" aria-label="关闭" id="plugin-deploy-close-btn" data-action="closePluginDeployDialog">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- 确认视图：部署信息 + 策略选择 + 环境预检（固定高度与内边距，切换时不抖动） -->
      <div class="modal-body plugin-deploy-view" id="plugin-deploy-confirm-view">
        <div class="plugin-deploy-info" id="plugin-deploy-info"></div>
        <div class="plugin-deploy-strategy" id="plugin-deploy-strategy-row"></div>
        <div class="plugin-deploy-env" id="plugin-deploy-env"></div>
      </div>

      <!-- 进度视图：进度条 + 步骤胶囊 + 终端日志（同等高度，尺寸绝不忽大忽小） -->
      <div class="modal-body plugin-deploy-view" id="plugin-deploy-progress-view" style="display: none;">
        <div class="plugin-deploy-progress-wrap">
          <div class="plugin-deploy-progress-bar-row">
            <div class="plugin-deploy-progress-bar-track">
              <div class="plugin-deploy-progress-bar-fill" id="plugin-deploy-progress-fill" style="width: 0%;"></div>
            </div>
            <span class="plugin-deploy-progress-percent" id="plugin-deploy-progress-percent">0%</span>
          </div>
          <p class="plugin-deploy-progress-message" id="plugin-deploy-progress-message">准备中...</p>
          <div class="plugin-deploy-steps" id="plugin-deploy-steps"></div>
          <div class="plugin-deploy-log" id="plugin-deploy-log"></div>
        </div>
      </div>

      <div class="modal-footer">
        <button id="plugin-deploy-cancel-btn" class="modal-btn modal-btn-cancel">取消</button>
        <button id="plugin-deploy-confirm-btn" class="modal-btn modal-btn-confirm">开始安装</button>
      </div>
    </div>
  </div>
